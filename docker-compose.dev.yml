services:
  app:
    container_name: oinkved-api-dev
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: >
      sh -c "npm run start:dev"
    ports:
      - "3001:3001"
    depends_on:
      - db
    environment:
      DATABASE_URL: ${DATABASE_URL}
      WT_SECRET: ${JWT_SECRET}
    volumes:
      - .:/app
      - /app/node_modules
  db:
    image: postgres:15-alpine
    container_name: postgres_db_nest_dev
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
volumes:
  postgres_data_dev:
